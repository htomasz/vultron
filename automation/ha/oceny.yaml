alias: "Vultron: Nowa Ocena"
description: Powiadomienie o nowej ocenie (obsługa okresów p1 i p2)
triggers:
  - trigger: state
    entity_id:
      - sensor.vultron_oceny_***_p1
      - sensor.vultron_oceny_***_p2
    attribute: lista_przedmiotow
actions:
  - variables:
      # Pobieramy stary i nowy stan atrybutu
      old_list: >
        {{ trigger.from_state.attributes.lista_przedmiotow if
        trigger.from_state and trigger.from_state.attributes.lista_przedmiotow
        else [] }}
      new_list: >
        {{ trigger.to_state.attributes.lista_przedmiotow }}

      # Logika wykrywania nowych ocen (odporna na duplikaty)
      nowe_oceny: >
        {% set ns = namespace(found=[]) %}
        {% for n_item in new_list %}
          {# Znajdź ten sam przedmiot w poprzednim stanie #}
          {% set o_item = old_list | selectattr('przedmiot', 'eq', n_item.przedmiot) | list | first | default({'oceny': []}, true) %}

          {# Stwórz listę kluczy dla starych ocen #}
          {% set old_keys = o_item.oceny | map('string') | list %}

          {# Pomocniczy namespace do odhaczania sprawdzonych, starych ocen #}
          {% set ns_inner = namespace(used=[]) %}

          {% for o in n_item.oceny %}
            {% set o_str = o | string %}

            {# Ile razy ta ocena występowała w starym stanie? #}
            {% set old_count = old_keys | select('eq', o_str) | list | count %}
            {# Ile razy zdążyliśmy ją już odhaczyć w tej pętli? #}
            {% set used_count = ns_inner.used | select('eq', o_str) | list | count %}

            {% if used_count < old_count %}
              {# To jest stara ocena, "zużywamy" jedno wystąpienie #}
              {% set ns_inner.used = ns_inner.used + [o_str] %}
            {% else %}
              {# Brakowało tej oceny w starym stanie (lub pula została wyczerpana) - TO JEST NOWA OCENA! #}
              {% set ns.found = ns.found + [{
                "przedmiot": n_item.przedmiot,
                "ocena": o.w,
                "opis": o.i,
                "data": o.d
              }] %}
            {% endif %}
          {% endfor %}
        {% endfor %}
        {{ ns.found }}

  # Kontynuuj tylko jeśli znaleziono nowe oceny
  - condition: template
    value_template: "{{ nowe_oceny | count > 0 }}"

  # Wyślij powiadomienie dla każdej nowej oceny
  - repeat:
      for_each: "{{ nowe_oceny }}"
      sequence:
        - data:
            title: "Nowa ocena: {{ repeat.item.przedmiot }}"
            message: >
              {# Wyciągamy czyste imię i informację o okresie z friendly_name #}
              {% set fn = trigger.to_state.attributes.friendly_name %}
              {% set uczen = fn.split(' (')[0].replace('Oceny: ', '') %}
              {% set okres = "z 1. semestru" if "Okres 1" in fn else "z 2. semestru" %}

              {{ uczen }} otrzymał(a) **{{ repeat.item.ocena }}** z przedmiotu **{{ repeat.item.przedmiot }}** ({{ okres }}).

              Opis: {{ repeat.item.opis }} ({{ repeat.item.data }})
            # Dodano repeat.index, aby zagwarantować unikalne ID nawet w tej samej milisekundzie
            notification_id: "ocena_{{ repeat.item.przedmiot | slugify }}_{{ as_timestamp(now()) | int }}_{{ repeat.index }}"
          action: persistent_notification.create
alias: "Vultron: Nowa Ocena"
description: Powiadomienie o nowej ocenie (wersja obiektowa)
triggers:
  - entity_id:
      - sensor.vultron_oceny_amelia_huc
    attribute: lista_przedmiotow
    trigger: state
actions:
  - variables:
      nowe_oceny: >
        {% set old_list = trigger.from_state.attributes.lista_przedmiotow if
        trigger.from_state and trigger.from_state.attributes.lista_przedmiotow
        else [] %} {% set new_list =
        trigger.to_state.attributes.lista_przedmiotow %} {% set ns =
        namespace(found=[]) %}

        {% for n_item in new_list %}
          {# Znajdź ten sam przedmiot w starym stanie #}
          {% set o_item = old_list | selectattr('przedmiot', 'eq', n_item.przedmiot) | first | default({'oceny': []}, true) %}
          
          {# Stwórz listę "kluczy" dla starych ocen tego przedmiotu #}
          {% set old_keys = o_item.oceny | map('string') | list %}
          
          {# Sprawdź każdą nową ocenę #}
          {% for o in n_item.oceny %}
            {% if o | string not in old_keys %}
              {% set ns.found = ns.found + [{
                "przedmiot": n_item.przedmiot,
                "ocena": o.w,
                "opis": o.i,
                "data": o.d
              }] %}
            {% endif %}
          {% endfor %}
        {% endfor %} {{ ns.found }}
  - condition: template
    value_template: "{{ nowe_oceny | count > 0 }}"
  - repeat:
      for_each: "{{ nowe_oceny }}"
      sequence:
        - data:
            title: "Nowa ocena: {{ repeat.item.przedmiot }}"
            message: >
              {% set uczen =
              trigger.to_state.attributes.friendly_name.replace('Oceny: ', '')
              %} {{ uczen }} otrzymał(a) **{{ repeat.item.ocena }}** z
              przedmiotu **{{ repeat.item.przedmiot }}**.

              Opis: {{ repeat.item.opis }} ({{ repeat.item.data }})
            notification_id: ocena_{{ repeat.item.przedmiot | slugify }}
          action: persistent_notification.create


blueprint:
  name: "Vultron: Alert Nowego Zebrania"
  description: "Wykrywa nowe zebrania w dzienniku EduVulcan i wysyła powiadomienia."
  domain: automation
  input:
    sensor_zebrania:
      name: "Sensor zebrań"
      description: "Wybierz sensor zebrań Twojego dziecka"
      selector:
        entity:
          filter:
            - domain: sensor
    actions:
      name: "Akcje do wykonania"
      description: "Dostępne zmienne: {{ uczen }}, {{ data }}, {{ godzina }}, {{ sala }}, {{ opis }}, {{ online }}"
      selector:
        action: {}

mode: parallel

trigger:
  - platform: state
    entity_id: !input sensor_zebrania
    attribute: zebrania

action:
  - variables:
      stare_id: >
        {% set old_list = trigger.from_state.attributes.zebrania if trigger.from_state and trigger.from_state.attributes.zebrania else [] %}
        {% set ns = namespace(items=[]) %}
        {% for z in old_list %}
          {% set ns.items = ns.items + [z.id | string] %}
        {% endfor %}
        {{ ns.items }}
      nowe_wpisy: >
        {% set ns = namespace(items=[]) %}
        {% for z in trigger.to_state.attributes.zebrania | default([]) %}
          {% if z.id | string not in stare_id %}
            {% set ns.items = ns.items + [z] %}
          {% endif %}
        {% endfor %}
        {{ ns.items }}

  - condition: template
    value_template: "{{ nowe_wpisy | count > 0 }}"

  - repeat:
      for_each: "{{ nowe_wpisy }}"
      sequence:
        - variables:
            uczen: "{{ trigger.to_state.attributes.friendly_name | replace('Zebrania: ', '') }}"
            data: "{{ repeat.item.data | default('—') }}"
            godzina: "{{ repeat.item.godzina | default('—') }}"
            sala: "{{ repeat.item.sala | default('—') }}"
            opis: "{{ repeat.item.opis | default('Brak opisu') }}"
            online: "{{ repeat.item.online | default('') }}"
        - choose: []
          default: !input actions
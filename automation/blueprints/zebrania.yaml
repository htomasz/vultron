blueprint:
  name: "Vultron — Powiadomienia o nowych zebraniach"
  description: >
    Wysyła persistent notification gdy na sensorze zebrań Vultron pojawi się
    zebranie z nowym ID (którego nie było w poprzednim stanie sensora).
  domain: automation
  input:
    sensor_zebrania:
      name: Sensor zebrań
      description: "Np. sensor.vultron_zebrania_amelia_huc"
      selector:
        entity:
          domain: sensor

trigger:
  - platform: state
    entity_id: !input sensor_zebrania

variables:
  stare_zebrania: "{{ trigger.from_state.attributes.zebrania | default([]) }}"
  nowe_zebrania: "{{ trigger.to_state.attributes.zebrania | default([]) }}"
  stare_id: "{{ stare_zebrania | map(attribute='id') | map('string') | list }}"
  nowe_wpisy: >
    {{ nowe_zebrania | selectattr('id', 'defined')
       | rejectattr('id', 'in', stare_id | map('string') | list)
       | list }}

condition:
  - condition: template
    value_template: "{{ nowe_wpisy | length > 0 }}"

action:
  - repeat:
      for_each: "{{ nowe_wpisy }}"
      sequence:
        - service: persistent_notification.create
          data:
            notification_id: "vultron_zebranie_{{ repeat.item.id }}"
            title: >
              📅 Nowe zebranie z rodzicami:
              {{ trigger.to_state.attributes.friendly_name
                 | replace('Zebrania: ', '') }}
            message: >
              **Data:** {{ repeat.item.data | default('—') }}
              **Godzina:** {{ repeat.item.godzina | default('—') }}
              **Sala:** {{ repeat.item.sala | default('—') }}

              {{ repeat.item.opis | default('Brak opisu') }}
              {%- if repeat.item.online %}

              **Link:** {{ repeat.item.online }}
              {%- endif %}

mode: queued
max: 5
blueprint:
  name: "Vultron: Zaawansowane powiadomienia o ocenach"
  description: "Wykrywa nowe oceny poprzez porównanie obiektów w atrybutach i wysyła powiadomienia."
  domain: automation
  input:
    vultron_sensor:
      name: "Sensor ocen"
      description: "Wybierz sensor ocen Twojego dziecka (np. sensor.vultron_oceny_jan_kowalski)"
      selector:
        entity:
          filter:
            - domain: sensor
    actions:
      name: "Akcje do wykonania"
      description: "Co ma się stać po wykryciu nowej oceny? Dostępne zmienne: {{ przedmiot }}, {{ ocena }}, {{ opis }}, {{ data }}, {{ uczen }}"
      selector:
        action: {}

mode: parallel

trigger:
  - platform: state
    entity_id: !input vultron_sensor
    attribute: lista_przedmiotow

action:
  - variables:
      # Przeniesiona Twoja logika porównywania obiektów
      nowe_oceny: >
        {% set old_list = trigger.from_state.attributes.lista_przedmiotow if
        trigger.from_state and trigger.from_state.attributes.lista_przedmiotow
        else [] %}
        {% set new_list = trigger.to_state.attributes.lista_przedmiotow %}
        {% set ns = namespace(found=[]) %}

        {% for n_item in new_list %}
          {# Znajdź ten sam przedmiot w starym stanie #}
          {% set o_item = old_list | selectattr('przedmiot', 'eq', n_item.przedmiot) | first | default({'oceny': []}, true) %}

          {# Stwórz listę "kluczy" dla starych ocen tego przedmiotu #}
          {% set old_keys = o_item.oceny | map('string') | list %}

          {# Sprawdź każdą nową ocenę #}
          {% for o in n_item.oceny %}
            {% if o | string not in old_keys %}
              {% set ns.found = ns.found + [{
                "przedmiot": n_item.przedmiot,
                "ocena": o.w,
                "opis": o.i,
                "data": o.d
              }] %}
            {% endif %}
          {% endfor %}
        {% endfor %}
        {{ ns.found }}

  - condition: template
    value_template: "{{ nowe_oceny | count > 0 }}"

  - repeat:
      for_each: "{{ nowe_oceny }}"
      sequence:
        # Wykonaj akcje zdefiniowane przez użytkownika dla każdej nowej oceny
        - variables:
            przedmiot: "{{ repeat.item.przedmiot }}"
            ocena: "{{ repeat.item.ocena }}"
            opis: "{{ repeat.item.opis }}"
            data: "{{ repeat.item.data }}"
            uczen: "{{ trigger.to_state.attributes.friendly_name.replace('Oceny: ', '') }}"
        - choose: []
          default: !input actions

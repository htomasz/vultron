version: 2
updates:
  # 1. AKTUALIZACJA DOCKERA (Bardzo ważne dla bezpieczeństwa obrazu Alpine)
  - package-ecosystem: "docker"
    directory: "/vultron" # Ścieżka do folderu, gdzie jest Dockerfile
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # 2. AKTUALIZACJA PYTHONA (Zadziała tylko, gdy stworzysz plik requirements.txt)
  - package-ecosystem: "pip"
    directory: "/vultron"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # 3. AKTUALIZACJA GITHUB ACTIONS (Skanery bezpieczeństwa itp.)
  - package-ecosystem: "github-actions"
    directory: "/" # Workflowy zawsze są w /.github/ wiec tu zostaje "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # 4. AKTUALIZACJA NPM (ESLint i wtyczka bezpieczeństwa używane w CI)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # 5. AKTUALIZACJA NARZĘDZI PYTHON W CI (semgrep, bandit, ruff - pliki .in/.txt z hashami)
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

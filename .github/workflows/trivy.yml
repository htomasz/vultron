name: Container & Dependency Scan

on: [push, pull_request,workflow_dispatch]

permissions:
  contents: read

# Nowy push do tej samej gałęzi anuluje poprzedni, niedokończony przebieg.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy scanner
        # Przypięte do SHA: w marcu 2026 tagi trivy-action zostały podmienione
        # (CVE-2026-33634), a @master wykonuje cokolwiek tam trafi.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          # Wersja Trivy (domyślna w trivy-action v0.36.0 to v0.70.0). Dependabot
          # jej nie podbija - aktualizuj ręcznie razem z akcją.
          version: 'v0.76.1'
          # Wskazujemy folder z Twoim projektem
          scan-ref: 'vultron/'
          format: 'table'
          severity: 'CRITICAL,HIGH'
name: Python Security Scan

on: [push, pull_request,workflow_dispatch]

permissions:
  contents: read

# Nowy push do tej samej gałęzi anuluje poprzedni, niedokończony przebieg.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'   # ta sama wersja co w obrazie

      - name: Install tools
        run: pip install --require-hashes -r .github/requirements/python-security.txt

      - name: Run Bandit (Security Linter)
        # Dodaliśmy --skip B301, aby zignorować ostrzeżenia o pickle
        run: bandit -r . -ll -ii --skip B301
      - name: Run Ruff (Fast Linter)
        # Ignorujemy:
        # S301 (Pickle), S113 (requests timeout)
        # S110/S112 (ciche except: pass/continue) NIE są ignorowane - błąd trzeba zalogować.
        run: ruff check . --select S --extend-ignore S301,S113

      # F (pyflakes) i E9 (błędy składni): niezdefiniowane nazwy, nieużywane importy itp.
      - name: Ruff - poprawność kodu
        run: ruff check . --select F,E9

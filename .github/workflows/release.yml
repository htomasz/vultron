name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write    # potrzebne do utworzenia GitHub Release
  packages: write    # potrzebne do wypchnięcia obrazu do GHCR

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # potrzebna pełna historia, żeby sprawdzić przynależność do main

      - name: Wyciągnij wersję z taga
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Sprawdź, że tag leży na main
        run: |
          git fetch origin main
          # ^{commit} dereferencuje tag z adnotacją do właściwego commita
          # (GITHUB_SHA bywa SHA-em obiektu taga, nie commita, dla `git tag -a`)
          COMMIT_SHA=$(git rev-parse "${GITHUB_REF}^{commit}")
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/main; then
            echo "::error::Tag ${{ steps.version.outputs.version }} nie wskazuje na commit z main. Release przerwany."
            exit 1
          fi

      - name: Sprawdź spójność wersji z config.yaml
        run: |
          FILE_VERSION=$(grep -oP '(?<=version: ")[^"]+' vultron/config.yaml)
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) != wersja w vultron/config.yaml ($FILE_VERSION). Release przerwany."
            exit 1
          fi

  release-addon:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Spakuj dodatek do zip
        run: |
          cd vultron
          zip -r "../vultron-${{ needs.verify.outputs.version }}.zip" .

      - name: Utwórz GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.verify.outputs.version }}" \
            "vultron-${{ needs.verify.outputs.version }}.zip" \
            --title "v${{ needs.verify.outputs.version }}" \
            --generate-notes

  release-docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Zaloguj do GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ustaw QEMU (emulacja aarch64 na runnerze amd64)
        uses: docker/setup-qemu-action@v4

      - name: Ustaw Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build i push obrazu (amd64 + aarch64)
        uses: docker/build-push-action@v6
        with:
          context: ./vultron
          file: ./vultron/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/htomasz/vultron:${{ needs.verify.outputs.version }}
            ghcr.io/htomasz/vultron:latest
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

# Globalnie tylko odczyt; zapis dostają wyłącznie joby, które go potrzebują.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # potrzebna pełna historia, żeby sprawdzić przynależność do main

      - name: Wyciągnij wersję z taga
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Sprawdź, że tag leży na main
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          git fetch origin main
          # ^{commit} dereferencuje tag z adnotacją do właściwego commita
          # (GITHUB_SHA bywa SHA-em obiektu taga, nie commita, dla `git tag -a`)
          COMMIT_SHA=$(git rev-parse "${GITHUB_REF}^{commit}")
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/main; then
            echo "::error::Tag $VER nie wskazuje na commit z main. Release przerwany."
            exit 1
          fi

      - name: Sprawdź spójność wersji z config.yaml
        env:
          TAG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          FILE_VERSION=$(grep -oP '(?<=version: ")[^"]+' vultron/config.yaml)
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) != wersja w vultron/config.yaml ($FILE_VERSION). Release przerwany."
            exit 1
          fi
          # Ta sama wersja musi być w labelu obrazu i w README.
          DOCKER_VERSION=$(grep -oP '(?<=io\.hass\.version=")[^"]+' vultron/Dockerfile || true)
          if [ "$DOCKER_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) != io.hass.version w vultron/Dockerfile ($DOCKER_VERSION). Release przerwany."
            exit 1
          fi
          README_VERSION=$(grep -oP '(?<=\*\*Wersja:\*\* )[0-9]+\.[0-9]+\.[0-9]+' README.md || true)
          if [ "$README_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) != wersja w README.md ($README_VERSION). Release przerwany."
            exit 1
          fi

  release-addon:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # utworzenie GitHub Release
      id-token: write       # podpis Sigstore (attestation)
      attestations: write   # zapis attestation w repo
    env:
      VER: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Spakuj dodatek do zip
        run: |
          cd vultron
          zip -r "../vultron-$VER.zip" .

      # Podpisana provenance (SLSA, Sigstore): dowód, że zip zbudowało CI
      # z tego repo. Weryfikacja: gh attestation verify vultron-X.zip -R htomasz/vultron
      - name: Podpisz zip (build provenance)
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: vultron-${{ needs.verify.outputs.version }}.zip

      - name: Utwórz GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "vultron-$VER.zip.sigstore.json"
          # Opis wydania = sekcja tej wersji z CHANGELOG (nagłówek "## **X.Y.Z - Nazwa** — data").
          # Bez sekcji: notatki generowane przez GitHub, jak dotąd.
          awk -v ver="$VER" '
            index($0, "## **" ver " ") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' vultron/CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            NOTES=(--notes-file release-notes.md)
          else
            echo "::warning::Brak sekcji $VER w vultron/CHANGELOG.md - opis wygeneruje GitHub."
            NOTES=(--generate-notes)
          fi
          gh release create "$VER" \
            "vultron-$VER.zip" \
            "vultron-$VER.zip.sigstore.json" \
            --title "v$VER" \
            "${NOTES[@]}"

  # Obraz zwykle już jest: build-image.yml zbudował go przy pushu z tą wersją.
  # Używamy go tylko, jeśli powstał z tego samego vultron/ co tag (src-<hash>);
  # inaczej (zapomniany push, zmiana po buildzie) budujemy go teraz.
  release-docker:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90   # QEMU arm64 bywa wolny
    # Ta sama grupa co build-image.yml: tag wypchnięty zaraz po main czeka,
    # aż trwający build skończy, zamiast budować obraz drugi raz.
    concurrency:
      group: build-image
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write       # wypchnięcie / przetagowanie obrazu w GHCR
      id-token: write       # podpis Sigstore (gdy budujemy tutaj)
      attestations: write   # zapis attestation (gdy budujemy tutaj)
    env:
      IMAGE: ghcr.io/htomasz/vultron
      VER: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Zaloguj do GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Czy jest gotowy obraz z tego kodu
        id: prebuilt
        run: |
          TREE=$(git rev-parse HEAD:vultron)
          echo "tree=$TREE" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$IMAGE:src-$TREE" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Brak gotowego obrazu dla tego kodu - buduję teraz. Do końca buildu aktualizacja w HA może się nie udać."
          fi

      - name: Ustaw gotowy obraz jako :VER i :latest
        if: steps.prebuilt.outputs.found == 'true'
        env:
          TREE: ${{ steps.prebuilt.outputs.tree }}
        run: |
          # Przetagowanie zachowuje digest, więc podpis z build-image.yml
          # nadal pasuje. :VER wskazuje dokładnie kod z taga.
          docker buildx imagetools create \
            -t "$IMAGE:$VER" -t "$IMAGE:latest" "$IMAGE:src-$TREE"

      - name: Ustaw QEMU (emulacja aarch64 na runnerze amd64)
        if: steps.prebuilt.outputs.found != 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # Kopia z mirrora Google zamiast Docker Hub (limity i timeouty).
          image: mirror.gcr.io/tonistiigi/binfmt:latest

      - name: Ustaw Buildx
        if: steps.prebuilt.outputs.found != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          # FROM alpine z Dockerfile też idzie przez mirror -
          # sam Dockerfile zostaje bez zmian.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Build i push obrazu (amd64 + aarch64)
        if: steps.prebuilt.outputs.found != 'true'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./vultron
          file: ./vultron/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VER }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:src-${{ steps.prebuilt.outputs.tree }}

      - name: Podpisz obraz (build provenance)
        if: steps.prebuilt.outputs.found != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Skan opublikowanego obrazu (CVE w pakietach Alpine/Chromium).
  scan-image:
    needs: [verify, release-docker]
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: $/.github/workflows/trivy-image.yml
    with:
      tag: ${{ needs.verify.outputs.version }}
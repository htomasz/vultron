name: GPE provider tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install test dependencies
        run: python -m pip install -r vultron/requirements.txt pytest
      - name: Test GPE response contracts
        run: python -m pytest -q tests
      - name: Test message card compatibility
        run: node --test tests/test_messages_card.cjs

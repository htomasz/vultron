name: GPE provider tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

# Nowy push do tej samej gałęzi anuluje poprzedni, niedokończony przebieg.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'   # ta sama wersja co w obrazie (requirements.txt pod 3.14)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install test dependencies
        # Obie listy z hashami (pytest: .github/requirements/tests.txt).
        run: python -m pip install --require-hashes -r vultron/requirements.txt -r .github/requirements/tests.txt
      - name: Prepare /data for vultron.py unit tests
        # vultron.py przy imporcie czyta /data/options.json i pisze log do /data
        # (tests/test_vultron_core.py). Dane testowe, bez prawdziwego konta.
        run: |
          sudo mkdir -p /data
          sudo chown "$(id -u):$(id -g)" /data
          printf '%s' '{"username":"test@example.com","password":"x","log_level":"info"}' > /data/options.json
      - name: Test GPE response contracts
        run: python -m pytest -q tests
      - name: Test message card compatibility
        run: node --test tests/test_messages_card.cjs

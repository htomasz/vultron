name: GitHub Actions Security (zizmor)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions: {}

# Nowy push do tej samej gałęzi anuluje poprzedni, niedokończony przebieg.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write   # wyniki do zakładki Security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Skanuj workflowy
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
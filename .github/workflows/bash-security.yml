name: "Skanowanie Bash (ShellCheck)"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        # Szukamy wszystkich plików .sh i skanujemy je do formatu SARIF
        run: |
          # Instalacja narzędzia do konwersji (jeśli potrzebne) lub użycie wbudowanego formatu
          # ShellCheck w wersji na GitHubie wspiera format SARIF natywnie
          files=$(find . -name "*.sh")
          if [ -z "$files" ]; then
            echo "Nie znaleziono plików .sh do przeskanowania."
            exit 0
          fi
          shellcheck -f sarif $files > shellcheck-results.sarif || true

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        # Wyślemy raport tylko jeśli plik powstał
        if: always()
        with:
          sarif_file: shellcheck-results.sarif

name: "Skanowanie Bash (ShellCheck)"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run ShellCheck
        id: run_shellcheck
        run: |
          # Znajdź wszystkie pliki .sh (omijając folder .git)
          FILES=$(find . -type f -name "*.sh" -not -path "*/.*")

          if [ -z "$FILES" ]; then
            echo "Brak plików .sh do przeskanowania."
            echo "created_report=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Uruchom shellcheck i zapisz wynik do pliku
          shellcheck -f sarif $FILES > shellcheck-results.sarif || true

          # Sprawdź czy plik nie jest pusty
          if [ -s shellcheck-results.sarif ]; then
            echo "created_report=true" >> $GITHUB_OUTPUT
          else
            echo "created_report=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: steps.run_shellcheck.outputs.created_report == 'true'
        with:
          sarif_file: shellcheck-results.sarif

name: Lint & Semgrep
on: [push, pull_request, workflow_dispatch]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 20

    - name: Install & Lint
      run: |
        if [ -f package.json ]; then
          npm ci || npm install  # ci fail → install
          npx eslint . --ext .js,.ts || echo "ESLint OK or skipped"
        fi

    - name: Semgrep scan
      uses: returntocorp/semgrep-action@v1
      with:
        config: auto
      continue-on-error: true  # Nie blokuje workflow na findings

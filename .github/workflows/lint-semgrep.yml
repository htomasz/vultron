name: Lint & Semgrep
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install & Lint
        run: |
          if [ -f package.json ]; then
            npm ci || npm install  # ci fail → install
            npx eslint . --ext .js,.ts || echo "ESLint OK or skipped"
          fi

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Semgrep scan
        run: |
          pip install semgrep
          semgrep scan --config auto
        continue-on-error: true  # Nie blokuje workflow na findings
name: Dockerfile Linter

on: [push, pull_request,workflow_dispatch]

permissions:
  contents: read

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          # Naprawiona ścieżka do Twojego Dockerfile
          dockerfile: vultron/Dockerfile
          # Ignorujemy błędy wersji paczek, żeby nie "zaśmiecać" wyniku
          ignore: DL3007,DL3018,DL3008,DL3013
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]   # blueprinty HA używają tagu !input
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--select, S, --extend-ignore, "S301,S113", --fix]
      - id: ruff-check
        name: ruff (poprawność)
        args: [--select, "F,E9"]

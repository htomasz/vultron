repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.2
    hooks:
      - id: ruff
        # Te same flagi, które ustaliliśmy dla CI, aby nie było błędów stylu
        args: [--select, S, --extend-ignore, "S301,S110,S112,S113", --fix]

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint
        args: [--ignore, DL3007, --ignore, DL3018, --ignore, DL3008, --ignore, DL3013]
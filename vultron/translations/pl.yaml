configuration:
  provider:
    name: "Portal dziennika"
    description: "eduvulcan – konto eduVULCAN; gdansk – GPE/UONET+ pod adresem uonetplus.edu.gdansk.pl."
  student_name:
    name: "Imię i nazwisko ucznia (opcjonalnie)"
    description: "Dla GPE: dokładne imię i nazwisko. Puste pole pobiera wszystkich uczniów z bieżącego roku szkolnego."
  username:
    name: "Nazwa użytkownika"
    description: "eduVULCAN: adres e-mail. GPE Gdańsk: login konta podany przy rejestracji, który może różnić się od dodatkowego adresu e-mail."
  password:
    name: "Hasło"
    description: "Twoje hasło do e-dziennika."
  log_level:
    name: "Poziom logowania"
    description: "Określa szczegółowość logów w zakładce Logi. Domyślnie: info. Uwaga: trace zapisuje do logu pełne odpowiedzi dziennika (oceny, uwagi, treści wiadomości) - używaj tylko do diagnozy i wyłącz po niej."
  test_mode:
    name: "Tryb testowy (bez przerw nocnych i weekendowych)"
    description: "Pobiera dane także w nocy i w weekendy. Odstęp między pobraniami się nie zmienia. Tylko do testów, na co dzień wyłącz."
  mobile_api:
    name: "API mobilne (tylko eduVULCAN)"
    description: "Zalecane. Vultron pobiera dane tak jak aplikacja w telefonie: szybko, co kilkanaście minut, bez uruchamiania przeglądarki. Przeglądarka jest potrzebna tylko do rejestracji Vultrona jako urządzenia (pierwszy raz i np. po zmianie hasła). Osiągnięć i przedszkola API mobilne nie ma, patrz opcja niżej."
  mobile_interval:
    name: "Co ile minut pobierać dane (API mobilne)"
    description: "Dotyczy dni roboczych w ciągu dnia. Domyślnie 15, najmniej 10. W nocy i w weekendy obowiązuje zwykły harmonogram."
  mobile_web_refresh:
    name: "Osiągnięcia i przedszkole przez przeglądarkę (API mobilne)"
    description: "Włączone: raz na dobę Vultron loguje się przez przeglądarkę po osiągnięcia i dane przedszkola, bo API mobilne ich nie ma. Wyłączone: te dwie sekcje się nie aktualizują, reszta działa normalnie. Jeśli nie używasz osiągnięć ani przedszkola, wyłącz."

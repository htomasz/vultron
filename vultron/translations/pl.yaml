configuration:
  provider:
    name: "Portal dziennika"
    description: "eduvulcan – konto eduVULCAN; gdansk – GPE/UONET+ pod adresem uonetplus.edu.gdansk.pl."
  student_name:
    name: "Imię i nazwisko ucznia (opcjonalnie)"
    description: "Dla GPE: dokładne imię i nazwisko. Puste pole pobiera wszystkich uczniów z bieżącego roku szkolnego."
  username:
    name: "Nazwa użytkownika"
    description: "eduVULCAN: adres e-mail. GPE Gdańsk: login konta podany przy rejestracji, który może różnić się od dodatkowego adresu e-mail."
  password:
    name: "Hasło"
    description: "Twoje hasło do e-dziennika."
  log_level:
    name: "Poziom logowania"
    description: "Określa szczegółowość logów w zakładce Logi. Domyślnie: info. Uwaga: trace zapisuje do logu pełne odpowiedzi dziennika (oceny, uwagi, treści wiadomości) - używaj tylko do diagnozy i wyłącz po niej."
  test_mode:
    name: "Tryb testowy (Ignoruj harmonogram)"
    description: "Pomija przerwy z harmonogramu (nocne i weekendowe godziny pobierania). Odstęp 40-60 minut między pobraniami zostaje. Używaj tylko do testowania modyfikacji!"
  mobile_api:
    name: "Eksperyment: API mobilne (tylko eduVULCAN)"
    description: "Po zalogowaniu rejestruje Vultron jako urządzenie w API mobilnym eduVULCAN. Potem co cykl odczytuje tą drogą dane i zapisuje w logu tylko liczby rekordów (tryb cienia); encje dalej pochodzą ze stron WWW. Urządzenie zgłasza się jako „Vultron (Home Assistant)”."

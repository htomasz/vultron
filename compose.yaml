services:
  vultron:
    build:
      context: ./vultron
    container_name: vultron
    restart: unless-stopped
    mem_limit: 2g

    networks:
      - ha-net

    environment:
      TZ: Europe/Warsaw
      HA_URL: http://homeassistant:8123/api
      HA_WS_URL: ws://homeassistant:8123/api/websocket

    volumes:
      - ./data:/data:z
      - /sciezka/do/configu/homeassistant/www:/config/www:z
      - ./secrets/ha_token.txt:/run/secrets/ha_token:ro,z

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ha-net:
    external: true